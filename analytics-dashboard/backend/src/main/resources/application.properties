server.port=8082
spring.application.name=analytics-dashboard

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:analytics-dashboard-group}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/market_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:univalle_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:univalle_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
management.endpoints.web.exposure.include=health,info
