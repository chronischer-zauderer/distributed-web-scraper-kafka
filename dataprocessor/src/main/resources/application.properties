server.port=8081

# Kafka local por defecto; en Docker se sobreescribe con SPRING_KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=market-processor-group-v4

# Deserializadores idénticos a los serializadores del productor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Leer desde el inicio del tópico
spring.kafka.consumer.auto-offset-reset=earliest

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/market_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:univalle_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:univalle_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forzamos a Spring a usar el pool de conexionesHikari nativo integrado
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# Dialecto explícito de base de datos para Hibernate 7
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Generación y visualización automática de esquemas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
