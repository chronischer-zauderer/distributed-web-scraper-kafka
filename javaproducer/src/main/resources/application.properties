spring.application.name=javaproducer

# Modos de ejecución personalizados (Mocks para hoy lunes)
app.messaging.mode=kafka
app.cache.mode=redis

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka local por defecto; en Docker se sobreescribe con SPRING_KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Configuramos los traductores (Serializadores) a texto plano para clave y valor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Configuración del Circuit Breaker de Resilience4j
resilience4j.circuitbreaker.instances.scraperService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.scraperService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.scraperService.waitDurationInOpenState=10000